name: Build and verify
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: awe
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: awe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awe" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      AWE_DB_URL: jdbc:postgresql://localhost:5432/awe
      AWE_DB_USER: awe
      AWE_DB_PASSWORD: ci-only-secret
      AWE_AUTHOR_TOKEN: integration-author-token
      AWE_REVIEWER_TOKEN: integration-reviewer-token
      AWE_TEST_POSTGRES: "true"
      MAVEN_VERSION: 3.9.11
      MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify exact numeric display parsing
        run: node --test awe-registry/src/test/js/exact-json.test.cjs
      - name: Install checksum-verified Maven
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --show-error --silent --location --retry 2 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Check Java formatting
        run: mvn -B -ntp --strict-checksums spotless:check
      - name: Build, unit tests, and real PostgreSQL/HTTP integration
        run: mvn -B -ntp --strict-checksums verify
      - name: Require executed integration tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('awe-registry/target/surefire-reports').glob('TEST-*IntegrationTest.xml'))
          if not reports:
              raise SystemExit('No PostgreSQL integration-test reports were produced')
          count = 0
          for report in reports:
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib['tests'])
              if tests == 0 or any(int(suite.attrib.get(field, 0)) for field in ('failures', 'errors', 'skipped')):
                  raise SystemExit(f'Integration tests did not all execute successfully: {report.name}')
              count += tests
          print(f'Executed {count} integration tests across {len(reports)} suites; zero failed, errored, or skipped')
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: error
