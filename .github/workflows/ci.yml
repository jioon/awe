name: Build and verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: awe
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: awe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awe" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      AWE_DB_URL: jdbc:postgresql://localhost:5432/awe
      AWE_DB_USER: awe
      AWE_DB_PASSWORD: ci-only-secret
      AWE_AUTHOR_TOKEN: integration-author-token
      AWE_REVIEWER_TOKEN: integration-reviewer-token
      AWE_TEST_POSTGRES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
